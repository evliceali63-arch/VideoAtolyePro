name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify and build debug APK
        run: gradle lintDebug testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VideoAtolyePro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VideoAtolyePro-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
