plugins { id 'com.android.application' }
android { namespace 'com.videoatolye.pro'; compileSdk 35
 defaultConfig { applicationId 'com.videoatolye.pro'; minSdk 26; targetSdk 35; versionCode 30; versionName '0.3.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 useLibrary 'android.test.runner', false
 useLibrary 'android.test.base', false
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { debug {
  if (System.getenv('VIDEO_ATOLYE_KEYSTORE')) {
   storeFile file(System.getenv('VIDEO_ATOLYE_KEYSTORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
  }
 } }
 buildTypes { debug { signingConfig signingConfigs.debug } }
 testOptions { unitTests.includeAndroidResources = true
  unitTests.all { ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort'].each { key ->
   if(System.getProperty(key)) systemProperty key, System.getProperty(key)
  } }
 }
}
dependencies {
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'androidx.media3:media3-effect:1.5.1'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
